global:
  scrape_interval: 30s

scrape_configs:
  - job_name: mc-monitor
    static_configs:
      - targets:
          - monitor:8080

  - job_name: minecraft-exporter
    static_configs:
      - targets:
          - minecraft:19565

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
